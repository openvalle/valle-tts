[package]
name = "valle-tts"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Local multilingual voice cloning with pluggable TTS models"
repository = "https://github.com/openvalle/valle-tts"
homepage = "https://github.com/openvalle/valle-tts"
build = "build.rs"
documentation = "https://docs.rs/valle-tts"
readme = "README.md"
keywords = ["speech", "tts", "qwen", "voice-cloning", "audio"]
categories = ["multimedia::audio"]
include = ["src/**", "tests/**", "third_party/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "THIRD_PARTY.md", "models.json", "build.rs", "native/**", "vendor/**", "docs/**"]

[package.metadata.docs.rs]
no-default-features = true
features = ["qwen3", "download"]
targets = ["x86_64-unknown-linux-gnu"]

[[bin]]
name = "valle-tts"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["qwen3", "download", "cli"]
cli = ["dep:clap", "qwen3", "download"]
qwen3 = ["dep:cmake"]
download = ["dep:reqwest", "dep:sha2", "dep:fs2"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"], optional = true }
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"], optional = true }
sha2 = { version = "0.11.0", optional = true }
fs2 = { version = "0.4.3", optional = true }
tempfile = "3.27.0"

[build-dependencies]
cmake = { version = "0.1.58", optional = true }

[profile.release]
lto = "thin"
[profile.dev]
debug = 0
[profile.test]
debug = 0
